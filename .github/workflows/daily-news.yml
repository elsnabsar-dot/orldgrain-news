name: Daily grain news

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare grain news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          class PlainText(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, text):
                  self.parts.append(text)

          def clean_title(value):
              parser = PlainText()
              parser.feed(value)
              parser.close()
              return " ".join("".join(parser.parts).split()).rstrip(".")

          def editorial_post(title, date_label):
              sowing = re.fullmatch(
                  r"На (\d{1,2} [а-яё]+) озимыми в (?:РФ|России) засеяно "
                  r"(\d+(?:[,.]\d+)?) млн га",
                  title, re.IGNORECASE,
              )
              if sowing:
                  day, area = sowing.groups()
                  area = area.replace(".", ",")
                  return (
                      f"🌾 Озимая посевная в России — {area} млн га\n\n"
                      f"К {day} российские аграрии засеяли озимыми "
                      f"{area} млн гектаров.\n\n"
                      "Следующий ориентир — итоговая площадь сева и её "
                      "сравнение с прошлым сезоном.\n\n"
                      "#Посевная #Россия"
                  )

              harvest = re.fullmatch(
                  r"В (?:РФ|России) собрано (\d+(?:[,.]\d+)?) млн тонн зерна",
                  title, re.IGNORECASE,
              )
              if harvest:
                  volume = harvest.group(1).replace(".", ",")
                  return (
                      f"🌾 Уборка зерна в России — {volume} млн тонн\n\n"
                      f"В сводке от {date_label} указан сбор "
                      f"{volume} млн тонн зерна по стране.\n\n"
                      "Для сравнения с прошлым сезоном важно сверять "
                      "дату сводки и методику учёта.\n\n"
                      "#Урожай #Россия"
                  )

              return None

          preview = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          today = datetime.now(ZoneInfo("Europe/Saratov")).date()
          yesterday = today - timedelta(days=1)

          feed_request = urllib.request.Request(
              "https://www.zerno.ru/rss.xml",
              headers={"User-Agent": "WorldgrainNews/1.0 (RSS reader)"},
          )
          with urllib.request.urlopen(feed_request, timeout=30) as response:
              root = ET.fromstring(response.read(2_000_000))

          candidates = []
          for item in root.findall("./channel/item"):
              date_label = item.findtext("pubDate", "").strip()
              try:
                  item_date = datetime.strptime(date_label, "%d.%m.%Y").date()
              except ValueError:
                  continue

              if preview:
                  if not today - timedelta(days=7) <= item_date <= today:
                      continue
              elif item_date != yesterday:
                  continue

              title = clean_title(item.findtext("title", ""))
              post = editorial_post(title, date_label)
              if post:
                  candidates.append((item_date, post))

          if not candidates:
              print("Подходящих фактов за выбранный период нет.")
              raise SystemExit(0)

          _, message = max(candidates, key=lambda entry: entry[0])
          if preview:
              print(message)
              raise SystemExit(0)

          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              print("Повторная отправка пропущена.")
              raise SystemExit(0)

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Секрет TELEGRAM_BOT_TOKEN отсутствует.")

          body = json.dumps({
              "chat_id": "@worldgrain",
              "text": message,
              "disable_notification": True,
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Telegram вернул HTTP {error.code}.") from None
          except Exception:
              raise SystemExit("Ошибка связи. Проверь канал перед повторной отправкой.") from None

          if not result.get("ok"):
              raise SystemExit("Telegram отклонил публикацию.")
          print(f'Опубликован пост №{result["result"]["message_id"]}')
          PY
