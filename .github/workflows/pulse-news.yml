name: Pulse news

"on":
  workflow_dispatch:
  schedule:
    - cron: '36 15 * * *'

permissions:
  contents: write

concurrency:
  group: worldgrain-pulse-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare chickpea and lentil news
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 .github/workflows/scripts/pulse_news.py
