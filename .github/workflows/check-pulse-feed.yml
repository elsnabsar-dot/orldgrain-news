name: Check pulse feed

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Agroexport feed
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen


          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)


          def plain(value):
              parser = Text()
              parser.feed(value or "")
              parser.close()
              return " ".join(" ".join(parser.parts).split())


          feed = "https://aemcx.ru/feed/"
          request = Request(feed, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=25) as response:
              print(f"HTTP {response.status} | {response.url}")
              root = ET.fromstring(response.read())

          items = root.findall("./channel/item")
          print(f"Записей в RSS: {len(items)}")
          if not items:
              raise SystemExit("В ответе не найдено записей RSS.")

          crops = re.compile(
              r"\b(?:нут(?:а|у|ом|е)?|чечевиц(?:а|ы|е|у|ей|ою))\b",
              re.IGNORECASE,
          )
          full_text = "{http://purl.org/rss/1.0/modules/content/}encoded"
          matches = 0
          with_full_text = 0

          for item in items:
              title = plain(item.findtext("title"))
              description = plain(item.findtext("description"))
              article = plain(item.findtext(full_text))
              if article:
                  with_full_text += 1

              for field, value in (
                  ("заголовок", title),
                  ("описание", description),
                  ("текст RSS", article),
              ):
                  match = crops.search(value)
                  if match:
                      matches += 1
                      date = item.findtext("pubDate") or "дата не указана"
                      start = max(0, match.start() - 80)
                      end = min(len(value), match.end() + 100)
                      print(f"{date} | {field} | {title}")
                      print(f"Фрагмент: {value[start:end]}")
                      print(f"Для сверки: {item.findtext('link') or '—'}")
                      break

          print(f"Записей с полем полного текста: {with_full_text}")
          print(f"Записей про нут или чечевицу: {matches}")
          PY
