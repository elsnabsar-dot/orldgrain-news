name: Oilseed prices

on:
  workflow_dispatch:

permissions: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect oilseed price cards
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          request = urllib.request.Request(
              "https://astontd.ru/",
              headers={"User-Agent": "WorldgrainPrices/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              encoding = response.headers.get_content_charset() or "utf-8"
              html = response.read(6_000_000).decode(encoding)

          for pattern in (r"Прайс.{0,15}лист\s+действует", r"23[,.]50", r"26[,.]00"):
              matches = list(re.finditer(pattern, html, re.IGNORECASE))
              if not matches:
                  print(f"Совпадений нет: {pattern}")
                  continue
              for match in matches[-2:]:
                  start = max(0, match.start() - 350)
                  print(html[start:match.end() + 350])
                  print()
          PY
