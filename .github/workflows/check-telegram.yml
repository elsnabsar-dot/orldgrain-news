name: Check Telegram

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check bot connection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("ERROR: TELEGRAM_BOT_TOKEN is missing")
              sys.exit(1)

          try:
              url = "https://api.telegram.org/bot" + token + "/getMe"
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              print("ERROR: Telegram HTTP", error.code)
              sys.exit(1)
          except Exception:
              print("ERROR: Connection to Telegram failed")
              sys.exit(1)

          if not data.get("ok"):
              print("ERROR: Telegram rejected the request")
              sys.exit(1)

          username = data.get("result", {}).get("username", "")
          if username != "perviy_zernovoy_editor_bot":
              print("ERROR: Token belongs to a different bot")
              sys.exit(1)

          print("SUCCESS: @perviy_zernovoy_editor_bot connected")
          PY
